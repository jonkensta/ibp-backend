# IBP Server Configuration Template
#
# This is a sample/template configuration file.
# For local development: Copy this to server.conf and customize
#   cp sample.conf server.conf
#
# Config file resolution order:
#   1. CONF environment variable (if set) - explicit override
#   2. server.conf (if exists) - local/production config
#   3. sample.conf (fallback) - this template
#
# Environment Variable Substitution:
#   ${VAR} - Required variable, raises error if not set
#   ${VAR:-default} - Optional variable with default value

[server]
# Origins allowed to make cross-origin requests to the API (comma or whitespace
# separated, e.g. http://localhost:5173). Leave empty in production: nginx serves
# the frontend and proxies /api/ from the same origin, and the Vite dev server
# proxies /api/ too, so CORS is not needed.
cors_origins =

[database]
# Database connection URI
# For local development: sqlite+aiosqlite:///data.db
# For production (PostgreSQL): postgresql+asyncpg://user:pass@host:5432/dbname
uri = ${DATABASE_URL:-sqlite+aiosqlite:///data.db}

[logging]
# Root log level: DEBUG, INFO, WARNING, ERROR (default INFO). DEBUG is for
# local troubleshooting only.
level = INFO
# Log file. Leave empty (the default) to log to stderr, which journald captures
# when running under systemd (journalctl -u ibp-backend) and docker captures in
# a container. A relative path is resolved against this config file's
# directory, not the working directory.
logfile =
# Rotation for logfile: rotate at max_bytes (default 10 MiB) and keep
# backup_count old files (default 5), so at most max_bytes * (backup_count + 1)
# bytes are used. rotation_size is still read as a legacy alias of max_bytes.
max_bytes = 10485760
backup_count = 5
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

[address]
addressee = Inside Books Project
street1 = PO Box 301029
street2 =
city = Austin
state = Texas
zipcode = 78703

[providers]
timeout = 5.0

[warnings]
# Minimum days before release date to show warning
min_release_timedelta = 60
# Minimum days before postmark deadline to show warning
min_postmark_timedelta = 90
# Cache TTL for inmate data (hours)
inmates_cache_ttl = 24

[shipping]
unit_address_name = ATTN: Mailroom Staff
