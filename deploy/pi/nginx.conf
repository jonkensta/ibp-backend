# nginx config for the ibp-frontend container on ibp-server. HTTP only: the
# server is reached on the LAN and the tailnet, never from the internet.
#
# /api/ is proxied with the path unchanged: the backend is built with
# root_path="/api" and strips the prefix itself (see deploy/README.md).

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # The nginx:alpine image links these to the container's stdout/stderr.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Resolve the backend through Docker's DNS at request time, so nginx
    # starts (and recovers) even if the backend container was recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $backend http://ibp-backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A name search can make up to four 5 s provider requests.
            proxy_read_timeout 60s;
        }

        # index.html must never be cached, so a new release is picked up on
        # the next page load.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite puts content hashes in asset file names.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
