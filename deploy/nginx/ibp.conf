# Inside Books Project site for ibp-server.
#
# Install as /etc/nginx/sites-available/ibp, symlinked from sites-enabled,
# under Debian's stock /etc/nginx/nginx.conf (which includes sites-enabled/*
# and runs nginx as www-data). See deploy/README.md.
#
# Clients reach the server as ibp-server (tailnet), ibp-server.local (mDNS)
# and 192.168.1.156 (LAN), so this is the default server for port 80 and
# answers any Host header. Access is limited to the LAN and tailnet by the
# network, not here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ibp-server ibp-server.local 192.168.1.156 _;

    # Frontend build (ibp-frontend dist/). Must be outside /home/jstarr,
    # which is mode 0700 and unreadable by www-data.
    root /srv/ibp/www;
    index index.html;

    # Debian's logrotate config already covers /var/log/nginx/*.log.
    access_log /var/log/nginx/ibp.access.log;
    error_log /var/log/nginx/ibp.error.log;

    # Debian's nginx.conf turns gzip on but only for text/html.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml;

    # Backend. proxy_pass has no URI part, so the request path is passed
    # unchanged (/api/health stays /api/health). The app's root_path="/api"
    # strips the prefix for routing and makes /api/docs point at
    # /api/openapi.json.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A search can run up to four provider requests one after another,
        # each limited by [providers] timeout (5 s), on a slow Pi.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite puts content-hashed bundles under /assets/, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current bundles, so always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths get index.html and the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
